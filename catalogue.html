<script>const PRODUCTS = [{"id": "PROD-CUSTOMBUILD", "name": "Custom Automation Build Service", "price": 149.0, "kind": "single", "category": "Services", "problem": "Pick any template from our 2,000+ validated n8n library; we rebuild, wire and test it against YOUR accounts"}, {"id": "PROD-391C1150", "name": "Telegram Ai Bot Template", "price": 24.9, "kind": "single", "category": "Misc", "problem": "Automates misc tasks; original: telegram-ai-bot-template.json"}, {"id": "PROD-5F4525A6", "name": "ComfyUI Image Generation (verified template)", "price": 24.9, "kind": "single", "category": "Verified templates", "problem": "Verified automation template from the library \u2014 genuine node wiring, sandbox-executed with synthetic data"}, {"id": "PROD-FAE0AECE", "name": "Google Sheets Automation Template (verified)", "price": 24.9, "kind": "single", "category": "Verified templates", "problem": "Verified automation template from the library \u2014 genuine node wiring, sandbox-executed with synthetic data"}, {"id": "PROD-5B1BD1B8", "name": "Rapid ETL HTTP Transform (verified)", "price": 24.9, "kind": "single", "category": "Verified templates", "problem": "Verified automation template from the library \u2014 genuine node wiring, sandbox-executed with synthetic data"}, {"id": "PROD-D2E60AAE", "name": "AI Summarizer Template (verified)", "price": 24.9, "kind": "single", "category": "Verified templates", "problem": "Verified automation template from the library \u2014 genuine node wiring, sandbox-executed with synthetic data"}];
function render() {

    <div class="price">€${p.price.toFixed(2)}<small> · ${p.kind}</small></div>
    <a class="cta small" href="checkout.html?product=${p.id}">Buy</a></div>`).join('') || '<p class="note">No matches.</p>';
}
document.getElementById('q').addEventListener('input', render);
document.getElementById('k').addEventListener('change', render);
render();
</script>
