<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PRAXOVEN — Catalogue (0 automations in preparation)</title>
<meta name="description" content="PRAXOVEN catalogue — 0 n8n automations in preparation. Join the waitlist; checkout opens after acceptance testing.">
<link rel="stylesheet" href="style.css"></head>
<body>
<header class="nav"><span class="brand">◈ PRAXOVEN</span>
<div class="navlinks"><a href="index.html">Home</a><a href="guide.html">Free guide</a></div></header>
<section class="panel">
<h2>Catalogue — 0 automations in preparation</h2>
<input id="q" type="text" placeholder="Search (e.g. shopify, slack, sheets)…" style="width:100%">
<select id="k"><option value="">All kinds</option><option value="single">Workflows</option>
<option value="bundle">Bundles</option><option value="subscription">Subscription</option></select>
<div id="list" class="grid" style="margin-top:14px"></div>
<p class="note">Prices are indicative (EUR). Checkout is not yet open — joining the waitlist takes no payment.</p></section>
<script>const PRODUCTS = [];
function render() {
  const q = document.getElementById('q').value.toLowerCase();
  const k = document.getElementById('k').value;
  const list = document.getElementById('list');
  const rows = PRODUCTS.filter(p => (!k || p.kind === k) && (!q || (p.name + ' ' + (p.category||'') + ' ' + (p.problem||'')).toLowerCase().includes(q)));
  list.innerHTML = rows.slice(0, 200).map(p => `<div class="card"><div class="k">${p.category||'n8n'}</div>
    <h3>${p.name}</h3><p>${(p.problem||'').slice(0,120)}</p>
    <div class="price">€${p.price.toFixed(2)}<small> · ${p.kind}</small></div>
    <a class="cta small" href="checkout.html?product=${p.id}">Join waitlist</a></div>`).join('') || '<p class="note">No matches.</p>';
}
document.getElementById('q').addEventListener('input', render);
document.getElementById('k').addEventListener('change', render);
render();
</script>
</body></html>
