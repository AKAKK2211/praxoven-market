<select id="k"><option value="">All kinds</option><option value="single">Workflows</option>

<script>const PRODUCTS = [{"id": "PROD-4FEDFCF9", "name": "React To Pdfmonkey Callback", "price": 39.9, "kind": "single", "category": "Http", "problem": "n8n automation for the Http use case \u2014 in acceptance testing; join the waitlist for delivery details."}, {"id": "PROD-1E9FA37E", "name": "Splitout Workflow", "price": 39.9, "kind": "single", "category": "Splitout", "problem": "n8n automation for the Splitout use case \u2014 in acceptance testing; join the waitlist for delivery details."}, {"id": "PROD-623FFFE9", "name": "Baserow Markdown To Html", "price": 29.9, "kind": "single", "category": "Baserow", "problem": "n8n automation for the Baserow use case \u2014 in acceptance testing; join the waitlist for delivery details."}, {"id": "PROD-9532A54B", "name": "Luma Ai   Webhook Response V1   Ak", "price": 29.9, "kind": "single", "category": "Executiondata", "problem": "n8n automation for the Executiondata use case \u2014 in acceptance testing; join the waitlist for delivery details."}, {"id": "PROD-355930FB", "name": "Transform Image To Lego Style Using Line And Dall E", "price": 29.9, "kind": "single", "category": "Http", "problem": "n8n automation for the Http use case \u2014 in acceptance testing; join the waitlist for delivery details."}, {"id": "PROD-64AE782F", "name": "Airtable Markdown To Html", "price": 29.9, "kind": "single", "category": "Markdown", "problem": "n8n automation for the Markdown use case \u2014 in acceptance testing; join the waitlist for delivery details."}, {"id": "PROD-391C1150", "name": "Telegram Ai Bot Template", "price": 24.9, "kind": "single", "category": "Misc", "problem": "n8n automation for the Misc use case \u2014 in acceptance testing; join the waitlist for delivery details."}];
function render() {
  const q = document.getElementById('q').value.toLowerCase();
  const k = document.getElementById('k').value;
  const list = document.getElementById('list');
  const rows = PRODUCTS.filter(p => (!k || p.kind === k) && (!q || (p.name + ' ' + (p.category||'') + ' ' + (p.problem||'')).toLowerCase().includes(q)));
  list.innerHTML = rows.slice(0, 200).map(p => `<div class="card"><div class="k">${p.category||'n8n'}</div>
    <h3>${p.name}</h3><p>${(p.problem||'').slice(0,120)}</p>
    <div class="price">€${p.price.toFixed(2)}<small> · ${p.kind}</small></div>
    <a class="cta small" href="checkout.html?product=${p.id}">Join waitlist</a></div>`).join('') || '<p class="note">No matches.</p>';
}
document.getElementById('q').addEventListener('input', render);
document.getElementById('k').addEventListener('change', render);
render();
</script>
</body></html>
